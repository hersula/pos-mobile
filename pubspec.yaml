name: pos_mobile
description: Aplikasi kasir (POS) mobile - inventori, penjualan, akunting.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Networking
  dio: ^5.4.3

  # State management
  provider: ^6.1.2

  # Local storage (token, session, pengaturan printer)
  shared_preferences: ^2.2.3

  # Format angka & tanggal (Rupiah, dd MMM yyyy)
  intl: ^0.19.0

  # Cetak struk via printer thermal Bluetooth (ESC/POS)
  print_bluetooth_thermal: ^1.1.4
  esc_pos_utils_plus: ^2.0.4

  # Cek & minta izin Bluetooth (Android 12+)
  permission_handler: ^11.3.1

  # UUID lokal untuk id sementara (mis. optimistic cart item id)
  uuid: ^4.4.0

  # Scan barcode pakai kamera - dipakai di form produk & halaman kasir
  mobile_scanner: ^5.2.3

  # Buka halaman pengaturan Bluetooth sistem Android langsung dari dalam app
  android_intent_plus: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png

# Konfigurasi flutter_launcher_icons — generate app icon semua platform dari
# assets/icon/app_icon.png. Jalankan setelah `flutter create .`:
#   flutter pub get
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "assets/icon/app_icon_background.png"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 21
  remove_alpha_ios: true
