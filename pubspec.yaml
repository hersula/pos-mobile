name: pos_mobile
description: Aplikasi kasir (POS) mobile - inventori, penjualan, akunting.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Networking
  dio: ^5.5.0

  # State management
  provider: ^6.1.2

  # Local storage (token, session, pengaturan printer)
  shared_preferences: ^2.2.3

  # Format angka & tanggal (Rupiah, dd MMM yyyy)
  intl: ^0.19.0

  # Cetak struk via printer thermal Bluetooth (ESC/POS)
  print_bluetooth_thermal: ^1.1.4
  esc_pos_utils_plus: ^2.0.4

  # Cek & minta izin Bluetooth (Android 12+)
  permission_handler: ^11.3.1

  # UUID lokal untuk id sementara (mis. optimistic cart item id)
  uuid: ^4.4.0

  # Scan barcode pakai kamera - dipakai di form produk & halaman kasir
  mobile_scanner: ^5.2.3

  package_info_plus: ^8.0.0
  http: ^1.2.2
  open_filex: ^4.4.0
  path_provider: ^2.1.3
  install_plugin: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # App Icon Generator
  flutter_launcher_icons: ^0.14.4

# Konfigurasi Icon Aplikasi
flutter_launcher_icons:
  android: true
  ios: true

  # lokasi file icon
  image_path: "assets/icon/pos-mobile.png"

  # Android adaptive icon
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/pos-mobile.png"

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
